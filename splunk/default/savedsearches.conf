[Proxy Migration - Unapproved SSL bypass]
search = index=proxy sourcetype=ssl_bypass:csv ssl_result="bypassed"  | lookup bypass_exceptions domain AS dest OUTPUT ticket | where isnull(ticket) | stats count AS sessions dc(user) AS users values(rule) AS legacy_rule BY dest | sort - sessions
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 15 7 * * 1-5
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
action.email = 0
description = Escalate: traffic bypassing TLS inspection with no exception on file

[Proxy Migration - Expired exception still in use]
search = | inputlookup bypass_exceptions | eval expired=if(strptime(expires,"%Y-%m-%d") < now(), 1, 0) | join type=left domain     [ search index=proxy sourcetype=ssl_bypass:csv        | stats count AS hits_30d latest(_time) AS last_seen BY dest | rename dest AS domain ] | fillnull value=0 hits_30d | eval finding=case(expired=1 AND hits_30d>0, "HIGH: expired but still used",                     expired=1, "LOW: expired, unused - delete",                     ticket="" OR isnull(ticket), "MEDIUM: no change ticket (no audit trail)",                     hits_30d=0, "LOW: active but unused - do not migrate",                     true(), "OK") | table domain reason approver ticket expires hits_30d last_seen finding | sort finding | search finding="HIGH*"
dispatch.earliest_time = -30d
cron_schedule = 20 7 * * 1
enableSched = 1
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
description = Weekly: exceptions past expiry that still match traffic
