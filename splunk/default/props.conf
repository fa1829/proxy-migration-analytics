# Synthetic legacy proxy export (CSV with header row)
[proxy:csv]
INDEXED_EXTRACTIONS = csv
TIMESTAMP_FIELDS = _time
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TZ = America/Toronto
SHOULD_LINEMERGE = false
# CIM alias so Web data model searches work
FIELDALIAS-cim = http_method AS method
EVAL-vendor_product = "legacy_swg"

[ssl_bypass:csv]
INDEXED_EXTRACTIONS = csv
TIMESTAMP_FIELDS = _time
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TZ = America/Toronto
SHOULD_LINEMERGE = false
